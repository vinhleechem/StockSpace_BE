name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockspace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/stockspace
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: '123456789012345'
      CLOUDINARY_API_SECRET: ci-test-secret

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode verify
