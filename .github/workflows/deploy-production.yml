name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_database:
        description: 'Reset all production business data after a verified backup'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'RESET_STOCKSPACE_PRODUCTION'
      purge_database_backups:
        description: 'Permanently delete all database backup files on the VPS'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'PURGE_STOCKSPACE_DATABASE_BACKUPS'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST" || (echo 'Missing VPS_HOST secret' && exit 1)
          test -n "$VPS_USERNAME" || (echo 'Missing VPS_USERNAME secret' && exit 1)
          test -n "$VPS_SSH_KEY_B64" || (echo 'Missing VPS_SSH_KEY_B64 secret' && exit 1)
          test -n "$VPS_KNOWN_HOSTS" || (echo 'Missing VPS_KNOWN_HOSTS secret' && exit 1)

      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run deployment on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          RESET_DATABASE: ${{ github.event.inputs.reset_database || 'no' }}
          PURGE_DATABASE_BACKUPS: ${{ github.event.inputs.purge_database_backups || 'no' }}
        run: |
          PORT="${VPS_PORT:-22}"
          REMOTE_COMMAND='bash /opt/stockspace/deploy.sh deploy'
          if [ "$RESET_DATABASE" = 'RESET_STOCKSPACE_PRODUCTION' ]; then
            REMOTE_COMMAND='CONFIRM_PRODUCTION_DB_RESET=RESET_STOCKSPACE_PRODUCTION bash /opt/stockspace/deploy.sh reset-db'
          elif [ "$PURGE_DATABASE_BACKUPS" = 'PURGE_STOCKSPACE_DATABASE_BACKUPS' ]; then
            REMOTE_COMMAND='CONFIRM_PRODUCTION_BACKUP_PURGE=PURGE_STOCKSPACE_DATABASE_BACKUPS bash /opt/stockspace/deploy.sh purge-db-backups'
          fi
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$PORT" \
            "$VPS_USERNAME@$VPS_HOST" \
            "$REMOTE_COMMAND"
