
services:
  postgres:
    restart: unless-stopped

  app:
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SEED_DEMO_USERS=false
      - CHATBOT_RAG_INDEXER_ENABLED=${CHATBOT_RAG_INDEXER_ENABLED:-true}
      - JAVA_TOOL_OPTIONS=-Xmx1536m -Xms512m -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError

  adminer:
    image: adminer:4.8.1-standalone
    container_name: stockspace-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockspace-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stockspace-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - adminer
    networks:
      - stockspace-net
    restart: unless-stopped

volumes:
  nginx_logs:
