# =============================================================================
# PRODUCTION — Chạy trên VPS
# Lệnh:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Hoặc dùng script:
#   bash deploy.sh deploy
#
# Khác với dev:
#   - Nginx làm reverse proxy nội bộ (port 80 → app:8080)
#   - HTTPS phải được terminate ở load balancer/CDN tin cậy, hoặc tự bật block
#     TLS trong nginx/nginx.conf sau khi cấp certificate.
#   - Port 8080 và 5432 KHÔNG expose ra ngoài
#   - restart: unless-stopped (auto-restart khi VPS reboot)
#   - JVM heap lớn hơn (-Xmx768m)
# =============================================================================

services:
  postgres:
    restart: unless-stopped
    # ⛔ Không expose port 5432 ra ngoài — chỉ internal network

  app:
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SEED_DEMO_USERS=false
      - CHATBOT_RAG_INDEXER_ENABLED=${CHATBOT_RAG_INDEXER_ENABLED:-true}
      - JAVA_TOOL_OPTIONS=-Xmx1536m -Xms512m -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError

  adminer:
    image: adminer:4.8.1-standalone
    container_name: stockspace-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockspace-net
    restart: unless-stopped
    # ⛔ Không expose port 8080 — Nginx sẽ proxy vào

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stockspace-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - adminer
    networks:
      - stockspace-net
    restart: unless-stopped

volumes:
  nginx_logs:
