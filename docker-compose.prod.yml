
services:
  postgres:
    restart: unless-stopped

  app:
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - SEED_DEMO_USERS=false
      - CHATBOT_RAG_INDEXER_ENABLED=${CHATBOT_RAG_INDEXER_ENABLED:-true}
      - JAVA_TOOL_OPTIONS=-Xmx1536m -Xms512m -XX:+UseContainerSupport -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError

  adminer:
    image: adminer:4.8.1-standalone
    container_name: stockspace-adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockspace-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: stockspace-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Keep HTTP active until the first certificate is issued. Set
      # NGINX_CONFIG=nginx.conf in the production .env to enable HTTPS.
      - ./nginx/${NGINX_CONFIG:-nginx.http.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - adminer
    networks:
      - stockspace-net
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  nginx_logs:
