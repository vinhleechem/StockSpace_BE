# =========================================================================
# StockSpace Configuration — DEVELOPMENT Profile (dev)
# Cấu hình dành riêng cho môi trường phát triển local.
# Tự động kích hoạt khi spring.profiles.active=dev
# =========================================================================

# 1. JPA & Hibernate Logging (Chỉ bật khi code ở local để dễ debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 2. Logging Levels (Bật LOG DEBUG cho code nghiệp vụ để dễ theo dõi flow)
logging.level.fu.stockspace=DEBUG
logging.level.org.springframework.security=INFO

# 3. Hibernate DDL Auto (Chỉ dùng update cho development)
spring.jpa.hibernate.ddl-auto=update
