spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=never

logging.level.fu.stockspace=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.reactive.function.client=WARN

app.data.seed-demo-users=${SEED_DEMO_USERS:true}
app.chatbot.trust-proxy-headers=true
app.security.cookie-secure=true
app.chatbot.rag.indexer.enabled=${CHATBOT_RAG_INDEXER_ENABLED:true}
