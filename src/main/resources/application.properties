spring.application.name=StockSpace_BE

# ==================== PostgreSQL ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockspace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / Hibernate ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== JWT ====================
app.jwt.secret=${JWT_SECRET:yMEh4Ugu-AjLamFpAHVTpDn-l2qlcQQNK98L3YTByH28Abs73PuhboCzQQK6mY365L-i0s6_hAPN__vaGmXRYQ}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==================== Server ====================
server.port=${SERVER_PORT:8080}
