spring.application.name=StockSpace_BE

spring.profiles.active=dev

# ==================== PostgreSQL ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockspace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / Hibernate ====================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== JWT ====================
app.jwt.secret=${JWT_SECRET:yMEh4Ugu-AjLamFpAHVTpDn-l2qlcQQNK98L3YTByH28Abs73PuhboCzQQK6mY365L-i0s6_hAPN__vaGmXRYQ}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==================== Server ====================
server.port=${SERVER_PORT:8080}

# ==================== Cloudinary ====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==================== Multipart Upload Limits ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
