spring.application.name=StockSpace_BE

spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockspace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:60000}

# Chatbot responses are streamed asynchronously (SSE) and can stay open for
# up to 90 seconds. Do not keep an OpenEntityManager/DB connection bound to
# that long-lived HTTP request; every database operation has its own short
# service transaction instead.
spring.jpa.open-in-view=false

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=false
spring.transaction.default-timeout=${TRANSACTION_TIMEOUT:30s}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.cookie-secure=${COOKIE_SECURE:false}

server.port=${SERVER_PORT:8080}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.vnpay.pay-url=${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.tmn-code=${VNP_TMN_CODE:2QXUIOJY}
app.vnpay.hash-secret=${VNP_HASH_SECRET:THCJDMMYVXPZNJTXHUPXKWJZXPEQJQUR}
app.vnpay.return-url=${VNP_RETURN_URL:http://localhost:8080/api/auth/vnpay-callback}
app.vnpay.frontend-callback-url=${VNP_FRONTEND_CALLBACK_URL:http://localhost:5173/wallet/callback}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:StockSpace <noreply@stockspace.com>}

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.model=${OPENROUTER_MODEL:}
app.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.openrouter.max-tokens=${OPENROUTER_MAX_TOKENS:1024}
app.openrouter.temperature=${OPENROUTER_TEMPERATURE:0.2}
app.openrouter.embedding-model=${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
app.openrouter.embedding-dimensions=${OPENROUTER_EMBEDDING_DIMENSIONS:1536}
app.openrouter.embedding-timeout-ms=${OPENROUTER_EMBEDDING_TIMEOUT_MS:3000}
app.openrouter.embedding-max-concurrent-requests=${OPENROUTER_EMBEDDING_MAX_CONCURRENT_REQUESTS:8}
app.openrouter.embedding-bulkhead-wait=${OPENROUTER_EMBEDDING_BULKHEAD_WAIT:100ms}
app.openrouter.connect-timeout=${OPENROUTER_CONNECT_TIMEOUT:5s}
app.openrouter.response-timeout=${OPENROUTER_RESPONSE_TIMEOUT:30s}
app.openrouter.request-timeout=${OPENROUTER_REQUEST_TIMEOUT:35s}
app.openrouter.bulkhead-wait=${OPENROUTER_BULKHEAD_WAIT:250ms}
app.openrouter.max-concurrent-requests=${OPENROUTER_MAX_CONCURRENT_REQUESTS:6}
app.openrouter.max-in-memory-response=${OPENROUTER_MAX_IN_MEMORY_RESPONSE:2MB}
app.openrouter.data-collection=${OPENROUTER_DATA_COLLECTION:deny}
app.openrouter.zdr=${OPENROUTER_ZDR:true}
app.openrouter.allow-insecure-provider=${OPENROUTER_ALLOW_INSECURE_PROVIDER:false}

app.chatbot.max-agent-iterations=${CHATBOT_MAX_AGENT_ITERATIONS:4}
app.chatbot.request-deadline=${CHATBOT_REQUEST_DEADLINE:75s}
app.chatbot.sse.timeout=${CHATBOT_SSE_TIMEOUT:90s}
app.chatbot.sse.heartbeat=${CHATBOT_SSE_HEARTBEAT:15s}
app.chatbot.sse.executor.core-pool-size=${CHATBOT_SSE_EXECUTOR_CORE:4}
app.chatbot.sse.executor.max-pool-size=${CHATBOT_SSE_EXECUTOR_MAX:6}
app.chatbot.sse.executor.queue-capacity=${CHATBOT_SSE_EXECUTOR_QUEUE:6}
app.chatbot.max-tool-result-chars=${CHATBOT_MAX_TOOL_RESULT_CHARS:16000}
app.chatbot.max-assistant-response-chars=${CHATBOT_MAX_RESPONSE_CHARS:16000}
app.chatbot.guest-session-ttl=${CHATBOT_GUEST_SESSION_TTL:24h}
app.chatbot.retention.enabled=${CHATBOT_RETENTION_ENABLED:true}
app.chatbot.retention.guest-purge-after=${CHATBOT_GUEST_PURGE_AFTER:7d}
app.chatbot.retention.batch-size=${CHATBOT_RETENTION_BATCH_SIZE:200}
app.chatbot.retention.interval-ms=${CHATBOT_RETENTION_INTERVAL_MS:3600000}
app.chatbot.retention.initial-delay-ms=${CHATBOT_RETENTION_INITIAL_DELAY_MS:300000}
app.chatbot.trust-proxy-headers=${CHATBOT_TRUST_PROXY_HEADERS:false}
app.chatbot.guest-rate-limit.enabled=${CHATBOT_GUEST_RATE_LIMIT_ENABLED:true}
app.chatbot.guest-rate-limit.requests-per-minute=${CHATBOT_GUEST_REQUESTS_PER_MINUTE:8}
app.chatbot.guest-rate-limit.max-concurrent-per-client=${CHATBOT_GUEST_MAX_CONCURRENT:2}
app.chatbot.guest-rate-limit.max-tracked-clients=${CHATBOT_GUEST_MAX_TRACKED_CLIENTS:10000}
app.chatbot.user-rate-limit.enabled=${CHATBOT_USER_RATE_LIMIT_ENABLED:true}
app.chatbot.user-rate-limit.requests-per-minute=${CHATBOT_USER_REQUESTS_PER_MINUTE:20}
app.chatbot.user-rate-limit.max-concurrent-per-user=${CHATBOT_USER_MAX_CONCURRENT:2}
app.chatbot.user-rate-limit.max-tracked-users=${CHATBOT_USER_MAX_TRACKED:10000}
app.chatbot.rag.max-candidates=${CHATBOT_RAG_MAX_CANDIDATES:200}
app.chatbot.rag.top-k=${CHATBOT_RAG_TOP_K:3}
app.chatbot.rag.min-score=${CHATBOT_RAG_MIN_SCORE:0.15}
app.chatbot.rag.indexer.enabled=${CHATBOT_RAG_INDEXER_ENABLED:false}
app.chatbot.rag.indexer.batch-size=${CHATBOT_RAG_INDEXER_BATCH_SIZE:32}
app.chatbot.rag.indexer.interval-ms=${CHATBOT_RAG_INDEXER_INTERVAL_MS:3600000}
app.chatbot.rag.indexer.initial-delay-ms=${CHATBOT_RAG_INDEXER_INITIAL_DELAY_MS:60000}
app.chatbot.rag.pgvector.enabled=${CHATBOT_PGVECTOR_ENABLED:true}
app.chatbot.rag.pgvector.schema-initializer-enabled=${CHATBOT_PGVECTOR_SCHEMA_INITIALIZER_ENABLED:true}
app.chatbot.rag.pgvector.ef-search=${CHATBOT_PGVECTOR_EF_SEARCH:100}

app.data.seed-demo-users=${SEED_DEMO_USERS:false}

spring.data.web.pageable.max-page-size=50

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never


