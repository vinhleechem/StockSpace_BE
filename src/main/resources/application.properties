spring.application.name=StockSpace_BE

spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]
# ==================== PostgreSQL ====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockspace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA / Hibernate ====================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================== JWT ====================
app.jwt.secret=${JWT_SECRET:yMEh4Ugu-AjLamFpAHVTpDn-l2qlcQQNK98L3YTByH28Abs73PuhboCzQQK6mY365L-i0s6_hAPN__vaGmXRYQ}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ==================== Server ====================
server.port=${SERVER_PORT:8080}

# ==================== Cloudinary ====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==================== Multipart Upload Limits ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ==================== VNPAY Configuration ====================
app.vnpay.pay-url=${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.tmn-code=${VNP_TMN_CODE:2QXUIOJY}
app.vnpay.hash-secret=${VNP_HASH_SECRET:THCJDMMYVXPZNJTXHUPXKWJZXPEQJQUR}
app.vnpay.return-url=${VNP_RETURN_URL:http://localhost:8080/api/auth/vnpay-callback}
app.vnpay.frontend-callback-url=${VNP_FRONTEND_CALLBACK_URL:http://localhost:5173/wallet/callback}

# ==================== Mail (Gmail SMTP) ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:StockSpace <noreply@stockspace.com>}

# ==================== Google OAuth ====================
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

# ==================== Frontend URL ====================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==================== Swagger UI ====================
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
