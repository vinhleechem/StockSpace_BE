worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    server_tokens off;

    gzip on;
    gzip_types text/plain application/json application/xml text/css text/javascript application/javascript;
    gzip_min_length 1024;

    map $request_method $guest_chat_client_key {
        default $binary_remote_addr;
        OPTIONS "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $guest_chat_client_key zone=guest_chat:10m rate=8r/m;
    limit_conn_zone $guest_chat_client_key zone=guest_chat_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream stockspace_backend {
        server app:8080;
        keepalive 32;
    }

    # Bootstrap config used only while Certbot obtains the first certificate.
    server {
        listen 80;
        server_name stockspace-capstone.duckdns.org;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        include /etc/nginx/includes/stockspace-locations.conf;
    }
}
