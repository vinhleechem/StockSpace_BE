worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Deliberately omit query strings so legacy guest session tokens cannot be
    # persisted in access logs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ─── Limit request body size (for file uploads) ───────────────────────────
    client_max_body_size 50M;

    # ─── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/xml text/css text/javascript application/javascript;
    gzip_min_length 1024;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    # Empty keys are not accounted by limit_req/limit_conn. Browser CORS
    # preflights therefore do not consume the guest AI budget before the POST.
    map $request_method $guest_chat_client_key {
        default $binary_remote_addr;
        OPTIONS "";
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $guest_chat_client_key zone=guest_chat:10m rate=8r/m;
    limit_conn_zone $guest_chat_client_key zone=guest_chat_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ─── Upstream: Spring Boot App ────────────────────────────────────────────
    upstream stockspace_backend {
        server app:8080;
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTP Server — redirect to HTTPS (nếu có SSL)
    # Nếu chưa có SSL, comment block server 443 và bỏ comment block HTTP dưới
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # ← thay bằng domain thật nếu có, VD: stockspace.example.com

        # Health check endpoint (không redirect)
        location /actuator/health {
            proxy_pass http://stockspace_backend;
        }

        # Redirect all HTTP → HTTPS
        # Bỏ comment 2 dòng dưới nếu đã cài SSL certificate
        # return 301 https://$host$request_uri;
        # Production must terminate TLS either here or at a trusted upstream
        # load balancer/CDN. Do not expose this HTTP listener directly.

        # Public AI endpoint has a much tighter cost/concurrency budget than
        # regular APIs. Spring applies a second per-client safety limit.
        location = /api/chat/guest/send {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    90s;

            limit_req zone=guest_chat burst=3 nodelay;
            limit_conn guest_chat_conn 2;
        }

        # Disable all intermediary response aggregation for genuine token
        # streaming. proxy_read_timeout is an idle timeout and is refreshed by
        # the application's periodic SSE heartbeat.
        location = /api/chat/guest/stream {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;

            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    120s;

            limit_req zone=guest_chat burst=3 nodelay;
            limit_conn guest_chat_conn 2;
        }

        location = /api/chat/stream {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;

            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    120s;

            limit_req zone=api burst=50 nodelay;
        }

        # ─── Nếu chưa có SSL, dùng block location này ─────────────────────
        location / {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Rate limiting
            limit_req zone=api burst=50 nodelay;

            # CORS headers (nếu không xử lý trong Spring)
            # add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS Server (mở khi đã có SSL certificate — ví dụ Let's Encrypt)
    # ─────────────────────────────────────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name stockspace.example.com;   # ← thay bằng domain thật
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     location / {
    #         proxy_pass http://stockspace_backend;
    #         proxy_http_version 1.1;
    #
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_set_header Connection        "";
    #
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout    60s;
    #         proxy_read_timeout    60s;
    #
    #         limit_req zone=api burst=50 nodelay;
    #     }
    # }
}
