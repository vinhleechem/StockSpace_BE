worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ─── Limit request body size (for file uploads) ───────────────────────────
    client_max_body_size 50M;

    # ─── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/xml text/css text/javascript application/javascript;
    gzip_min_length 1024;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ─── Upstream: Spring Boot App ────────────────────────────────────────────
    upstream stockspace_backend {
        server app:8080;
        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTP Server — redirect to HTTPS (nếu có SSL)
    # Nếu chưa có SSL, comment block server 443 và bỏ comment block HTTP dưới
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # ← thay bằng domain thật nếu có, VD: stockspace.example.com

        # Health check endpoint (không redirect)
        location /actuator/health {
            proxy_pass http://stockspace_backend;
        }

        # Redirect all HTTP → HTTPS
        # Bỏ comment 2 dòng dưới nếu đã cài SSL certificate
        # return 301 https://$host$request_uri;

        # ─── Nếu chưa có SSL, dùng block location này ─────────────────────
        location / {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Rate limiting
            limit_req zone=api burst=50 nodelay;

            # CORS headers (nếu không xử lý trong Spring)
            # add_header 'Access-Control-Allow-Origin' '*' always;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS Server (mở khi đã có SSL certificate — ví dụ Let's Encrypt)
    # ─────────────────────────────────────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name stockspace.example.com;   # ← thay bằng domain thật
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     location / {
    #         proxy_pass http://stockspace_backend;
    #         proxy_http_version 1.1;
    #
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_set_header Connection        "";
    #
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout    60s;
    #         proxy_read_timeout    60s;
    #
    #         limit_req zone=api burst=50 nodelay;
    #     }
    # }
}
