worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain application/json application/xml text/css text/javascript application/javascript;
    gzip_min_length 1024;

    map $request_method $guest_chat_client_key {
        default $binary_remote_addr;
        OPTIONS "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $guest_chat_client_key zone=guest_chat:10m rate=8r/m;
    limit_conn_zone $guest_chat_client_key zone=guest_chat_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream stockspace_backend {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;   # ← thay bằng domain thật nếu có, VD: stockspace.example.com

        location /actuator/health {
            proxy_pass http://stockspace_backend;
        }

        location /adminer/ {
            proxy_pass http://adminer:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /adminer;
        }

        location = /ws {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }


        location = /api/chat/guest/send {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    90s;

            limit_req zone=guest_chat burst=3 nodelay;
            limit_conn guest_chat_conn 2;
        }

        location = /api/chat/guest/stream {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;

            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    120s;

            limit_req zone=guest_chat burst=3 nodelay;
            limit_conn guest_chat_conn 2;
        }

        location = /api/chat/stream {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;

            proxy_connect_timeout 10s;
            proxy_send_timeout    90s;
            proxy_read_timeout    120s;

            limit_req zone=api burst=50 nodelay;
        }

        location / {
            proxy_pass http://stockspace_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            limit_req zone=api burst=50 nodelay;

        }
    }

}
