# =============================================================================
# BASE — Shared config giữa dev và prod
# Không chạy file này trực tiếp.
#   Dev:  docker compose up              (tự merge với docker-compose.override.yml)
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    container_name: stockspace-db
    environment:
      POSTGRES_DB: ${DB_NAME:-stockspace}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stockspace-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-stockspace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot App ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockspace-app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-stockspace}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-changeme}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${DDL_AUTO:-update}
      - SPRING_SQL_INIT_MODE=${SPRING_SQL_INIT_MODE:-always}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - APP_JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS:-604800000}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - VNP_PAY_URL=${VNP_PAY_URL}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      - VNP_FRONTEND_CALLBACK_URL=${VNP_FRONTEND_CALLBACK_URL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - OPENROUTER_EMBEDDING_DIMENSIONS=${OPENROUTER_EMBEDDING_DIMENSIONS:-1536}
      - OPENROUTER_EMBEDDING_TIMEOUT_MS=${OPENROUTER_EMBEDDING_TIMEOUT_MS:-3000}
      - OPENROUTER_EMBEDDING_MAX_CONCURRENT_REQUESTS=${OPENROUTER_EMBEDDING_MAX_CONCURRENT_REQUESTS:-8}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-1024}
      - OPENROUTER_TEMPERATURE=${OPENROUTER_TEMPERATURE:-0.2}
      - OPENROUTER_DATA_COLLECTION=${OPENROUTER_DATA_COLLECTION:-deny}
      - OPENROUTER_ZDR=${OPENROUTER_ZDR:-true}
      - OPENROUTER_ALLOW_INSECURE_PROVIDER=${OPENROUTER_ALLOW_INSECURE_PROVIDER:-false}
      - CHATBOT_SSE_TIMEOUT=${CHATBOT_SSE_TIMEOUT:-90s}
      - CHATBOT_SSE_HEARTBEAT=${CHATBOT_SSE_HEARTBEAT:-15s}
      - CHATBOT_SSE_EXECUTOR_CORE=${CHATBOT_SSE_EXECUTOR_CORE:-4}
      - CHATBOT_SSE_EXECUTOR_MAX=${CHATBOT_SSE_EXECUTOR_MAX:-12}
      - CHATBOT_SSE_EXECUTOR_QUEUE=${CHATBOT_SSE_EXECUTOR_QUEUE:-24}
      - CHATBOT_RAG_INDEXER_ENABLED=${CHATBOT_RAG_INDEXER_ENABLED:-false}
      - CHATBOT_RAG_INDEXER_BATCH_SIZE=${CHATBOT_RAG_INDEXER_BATCH_SIZE:-32}
      - CHATBOT_RAG_INDEXER_INTERVAL_MS=${CHATBOT_RAG_INDEXER_INTERVAL_MS:-3600000}
      - CHATBOT_RAG_INDEXER_INITIAL_DELAY_MS=${CHATBOT_RAG_INDEXER_INITIAL_DELAY_MS:-60000}
      - CHATBOT_PGVECTOR_ENABLED=${CHATBOT_PGVECTOR_ENABLED:-true}
      - CHATBOT_PGVECTOR_SCHEMA_INITIALIZER_ENABLED=${CHATBOT_PGVECTOR_SCHEMA_INITIALIZER_ENABLED:-true}
      - CHATBOT_PGVECTOR_EF_SEARCH=${CHATBOT_PGVECTOR_EF_SEARCH:-100}
      - CHATBOT_TRUST_PROXY_HEADERS=true
      - CHATBOT_USER_REQUESTS_PER_MINUTE=${CHATBOT_USER_REQUESTS_PER_MINUTE:-20}
      - CHATBOT_USER_MAX_CONCURRENT=${CHATBOT_USER_MAX_CONCURRENT:-2}
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-false}
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockspace-net

networks:
  stockspace-net:
    driver: bridge

volumes:
  postgres_data:
